<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist</title>
</head>
<body>
  <h1>Playlist</h1>

  <form id="song-form">
    <label for="song-input">New song</label>
    <input type="text" id="song-input" placeholder="Artist - Title" required autocomplete="off">
    <button type="submit">Add song</button>
  </form>

  <ul id="playlist"></ul>
  <p id="song-count"></p>

  <script src="js/playlist.js"></script>
</body>
</html>
