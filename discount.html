<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount</title>
</head>
<body>
  <h1>Discount</h1>

  <label for="amount">Amount ($)</label>
  <input type="number" id="amount" min="0" step="0.01">

  <button id="member-button" type="button">Not a member</button>
  <button id="calculate-button" type="button">Calculate</button>

  <p id="result"></p>

  <script>
    // Returns the discount percent for an order
    function getDiscount(total, isMember) {
      if (total >= 100 && isMember) {
        return 20;
      } else if (total >= 100 || isMember) {
        return 10;
      } else {
        return 0;
      }
    }

    const amountInput = document.querySelector('#amount');
    const memberButton = document.querySelector('#member-button');
    const calculateButton = document.querySelector('#calculate-button');
    const result = document.querySelector('#result');

    let isMember = false;

    // Clicking switches between member and not a member
    memberButton.addEventListener('click', function () {
      isMember = !isMember;
      memberButton.textContent = isMember ? 'Member' : 'Not a member';
    });

    calculateButton.addEventListener('click', function () {
      const total = parseFloat(amountInput.value);

      if (isNaN(total)) {
        result.textContent = 'Please enter an amount.';
        return;
      }

      const discount = getDiscount(total, isMember);
      const finalTotal = total - total * discount / 100;

      result.textContent = 'Discount: ' + discount + '% — Total: $' + finalTotal.toFixed(2);
    });
  </script>
</body>
</html>
