<!DOCTYPE html>
<html lang="en"> <!-- lang tells screen readers and translators the page is English -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page size itself to the phone screen instead of zooming out -->
    <title>Hello, World!</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li> <!-- The # makes it jump to an element on this same page, not to another site -->
            <li><a href="#interests">Interests</a></li>
        </ul>
    </nav>

    <h1 id="home" class="site-title">Hello, World!</h1> <!-- id is the unique name that #home is pointing at -->

    <p>Welcome to my website!</p>

    <section id="interests">
        <h2>My Interests</h2>
        <details open> <!-- added this -->
            <summary>Click to see my list of interests</summary>
            <ul>
                <li>Photography</li>
                <li>Food Blogging</li>
                <li>Art</li>
            </ul>
        </details>
    </section>
</body>
</html>
