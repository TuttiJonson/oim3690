<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <style>
        body {
            margin: 0;
            background-color: #f5f1e8;
            color: #2b2420;
            font-family: Georgia, 'Times New Roman', serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
        }

        nav ul {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: #2b2420;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 0.03em;
        }

        nav a:hover {
            color: #a3291f;
        }

        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            color: #a3291f;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        section {
            margin-top: 3rem;
            text-align: left;
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 1rem;
            text-align: center;
        }

        details {
            border-top: 1px solid #d8cfbe;
            border-bottom: 1px solid #d8cfbe;
            padding: 1rem 0;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }

        details ul {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">✳</a>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#interests">Interests</a></li>
        </ul>
    </nav>

    <main>
        <h1 id="home">Hello, World!</h1>
        <p>Welcome to my <mark>website</mark>!</p>

        <section id="interests">
            <h2>My Interests</h2>
            <details>
                <summary>Click to see my list of interests</summary>
                <ul>
                    <li>Photography</li>
                    <li>Food Blogging</li>
                    <li>Art</li>
                </ul>
            </details>
        </section>
    </main>

    <footer>
        <address>
            Contact me at <a href="mailto:otamarijonson@babson.edu">otamarijonson@babson.edu</a>
        </address>
        <p>Page last updated <time datetime="2026-09-10">September 10, 2026</time>.</p>
    </footer>
</body>
</html>
