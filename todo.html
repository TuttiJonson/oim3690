<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do</title>
  <link rel="stylesheet" href="css/todo.css"> #created a whole new tood.css 
</head>
<body>
  <main class="todo">
    <h1>To-Do List</h1>

    <form id="todo-form">
      <label for="todo-input" class="visually-hidden">New task</label>
      <input type="text" id="todo-input" placeholder="Add a task" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <p id="todo-count" class="count"></p>.    
  </main>

  <script src="js/todo.js"></script>        
</body>
</html>
