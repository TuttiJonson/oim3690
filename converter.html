<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 0 16px;
    }

    input, button {
      font-size: 1rem;
      padding: 8px;
    }

    label {
      display: block;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Celsius and Fahrenheit</h1>

  <label for="celsius">Celsius</label>
  <input type="number" id="celsius" placeholder="Degrees Celsius">

  <label for="fahrenheit">Fahrenheit</label>
  <input type="number" id="fahrenheit" placeholder="Degrees Fahrenheit">

  <script>
    // Pure math: takes a number, returns a number, no DOM
    function toFahrenheit(celsius) {
      return celsius * 9 / 5 + 32;
    }

    // Pure math: takes a number, returns a number, no DOM
    function toCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5 / 9;
    }

    const celsiusInput = document.querySelector('#celsius');
    const fahrenheitInput = document.querySelector('#fahrenheit');

    // Typing in Celsius updates Fahrenheit
    function handleCelsiusInput() {
      const celsius = parseFloat(celsiusInput.value);

      if (isNaN(celsius)) {
        fahrenheitInput.value = '';
        return;
      }

      fahrenheitInput.value = toFahrenheit(celsius).toFixed(1);
    }

    // Typing in Fahrenheit updates Celsius
    function handleFahrenheitInput() {
      const fahrenheit = parseFloat(fahrenheitInput.value);

      if (isNaN(fahrenheit)) {
        celsiusInput.value = '';
        return;
      }

      celsiusInput.value = toCelsius(fahrenheit).toFixed(1);
    }

    celsiusInput.addEventListener('input', handleCelsiusInput);
    fahrenheitInput.addEventListener('input', handleFahrenheitInput);
  </script>
</body>
</html>
